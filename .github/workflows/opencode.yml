name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Se ejecuta solo si el comentario contiene /oc o /opencode
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # Para autenticación segura (OIDC)
      contents: read      # Para crear/modificar archivos y ramas
      pull-requests: read   # Para abrir Pull Requests
      issues: write        # Para comentar en los issues
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          # ⚠️ Asegúrate de que este nombre coincida con el secreto que guardes en GitHub
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/glm-5.3-flash-free